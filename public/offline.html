<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kiwoko · Sin conexión</title>
    <meta name="theme-color" content="#e2231a" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #101010;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .dot {
        width: 56px; height: 56px; border-radius: 14px;
        background: #e2231a; margin: 0 auto 16px;
        display: grid; place-items: center; color: #fff; font-weight: 700;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #6b6b6b; margin: 0 0 20px; line-height: 1.5; }
      button {
        appearance: none; border: 0; border-radius: 8px;
        background: #e2231a; color: #fff; padding: 12px 18px;
        font-weight: 600; cursor: pointer; min-height: 44px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">K</div>
      <h1>Sin conexión</h1>
      <p>No hay red en este momento. Comprueba tu conexión y vuelve a intentarlo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
