name: Supabase - comprobar actividad de base de datos

on:
  push:
    paths:
      - '.github/workflows/supabase-db-check.yml'
  schedule:
    # Tres consultas de lectura al dia (UTC). GitHub puede retrasar los horarios.
    - cron: '41 5,13,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-check:
    name: Consulta real de PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Comprobar API PostgreSQL sin consultar datos privados
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.request
          from pathlib import Path

          values = {}
          for line in Path(".env").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              name, value = line.split("=", 1)
              values[name.strip()] = value.strip().strip('"').strip("'")

          url = (values.get("SUPABASE_URL") or values.get("VITE_SUPABASE_URL") or "").rstrip("/")
          key = values.get("SUPABASE_PUBLISHABLE_KEY") or values.get("VITE_SUPABASE_PUBLISHABLE_KEY")
          if not url.startswith("https://") or not url.endswith(".supabase.co") or not key:
              raise SystemExit("Falta una URL o clave publica valida en el archivo de configuracion")

          request = urllib.request.Request(
              f"{url}/rest/v1/",
              headers={"apikey": key, "Accept": "application/openapi+json", "Cache-Control": "no-cache"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  response.read(256)
                  print(f"API de base de datos responde HTTP {response.status}")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"API no disponible: HTTP {error.code}. Revisar pausa y credenciales.") from None
          except (urllib.error.URLError, TimeoutError) as error:
              raise SystemExit(f"API inaccesible: {error.__class__.__name__}") from None
          PY
